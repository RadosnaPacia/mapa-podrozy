<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mapa naszych podróży</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Grandstander:wght@700;800&family=Tiny5&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: full-bleed game-board map; floating HUD plaque top-left, journal panel on the right (bottom sheet on phones) */
  --ocean:#d5eaf4;
  --ocean-dot:#c3e0ee;
  --land:#f2f9e8;
  --rim:#b8d8ae;
  --visited:#ffd6e1;
  --paper:#fffbf6;
  --card:#ffffff;
  --ink:#4f486b;
  --ink-2:#7f7899;
  --line:#ebe4f2;
  --lav:#c9b8f2;
  --lav-deep:#8f78d8;
  --peach:#ffc7ad;
  --butter:#ffedb0;
  --mint:#bfe8d4;
  --pink:#ffc9d8;
  --sky:#b5daf5;
  --accent:var(--lav);
  --accent-deep:var(--lav-deep);
  --accent-soft:#f1ecfd;
  --font-display:"Grandstander","Baloo 2",ui-rounded,system-ui,sans-serif;
  --font-body:"Baloo 2",ui-rounded,system-ui,sans-serif;
  --font-pixel:"Tiny5",ui-monospace,monospace;
  --shadow:0 12px 32px rgba(79,72,107,.14),0 2px 6px rgba(79,72,107,.08);
  --peek:164px;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--ocean);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance;margin:0}
:focus-visible{outline:3px solid var(--accent-deep);outline-offset:2px;border-radius:10px}
.ic{display:block;flex:none}
.i{display:inline-flex}
[hidden]{display:none!important}

/* ---------- map board ---------- */
#board{position:fixed;inset:0;overflow:hidden;
  background:radial-gradient(circle,var(--ocean-dot) 1.3px,transparent 1.8px) 0 0/24px 24px,var(--ocean)}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#map.dragging{cursor:grabbing}
body.picking #map{cursor:crosshair}
#countries path,#visited path{vector-effect:non-scaling-stroke;stroke-linejoin:round}
#rim{fill:var(--rim);stroke:var(--rim);stroke-width:7}
.landTop{fill:var(--land);stroke:#fff;stroke-width:1.1}
#visited path{fill:var(--visited);stroke:#fff;stroke-width:1.1}
#visited path.cvis{cursor:pointer;transition:filter .15s}
#visited path.cvis:hover{filter:saturate(1.4) brightness(1.02)}
#visited path.sel{stroke:#4f486b;stroke-width:2.4}
body.mode-countries #countries path{cursor:pointer}
#tip{position:fixed;z-index:30;pointer-events:none;background:var(--ink);color:#fff;font-weight:700;font-size:13px;padding:4px 10px;border-radius:10px;white-space:nowrap;box-shadow:var(--shadow)}
.leg{fill:none;stroke-linecap:round}
.leg.home{opacity:.5}
.legBack{fill:none;stroke:#fff;stroke-linecap:round;opacity:.9}
.node{cursor:pointer}
.node .face{transition:transform .2s}
.node:hover .face,.node:focus-visible .face{transform:translateY(-2px)}
.node:focus{outline:none}
.node:focus-visible .disc{stroke-width:5}
.node:focus-visible .pin{stroke-width:4}
.pinnode:hover .face{transform:translateY(-3px) scale(1.12)}
input.locked{background:var(--paper);color:var(--ink-2)}
.who-btn[aria-pressed="false"] .i{opacity:.25}
#pinCard{position:fixed;z-index:31;width:224px;background:#fff;border-radius:18px;box-shadow:0 4px 0 var(--line),var(--shadow);overflow:hidden;pointer-events:none;animation:fade .15s}
#pinCard .pcimg{display:block;width:100%;height:116px;object-fit:cover;background:#f1ecfd}
#pinCard .pcimg.none{display:grid;place-items:center;height:52px;background:linear-gradient(135deg,#fff0f5,#f1ecfd);color:#a993e6}
#pinCard .pcb{padding:8px 12px 11px}
#pinCard b{display:block;font:800 19px/1.15 var(--font-display);color:var(--ink)}
#pinCard .pcm{font-size:12.5px;font-weight:700;color:var(--ink-2)}
#pinCard .pcy{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0 2px}
#pinCard .pcy span{font:400 14px var(--font-pixel);padding:1px 8px;border-radius:999px;background:var(--c);color:var(--cd)}
#pinCard .pct{display:grid;gap:2px;margin:6px 0 2px}
#pinCard .pct span{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--ink);min-width:0}
#pinCard .pct i{width:9px;height:9px;border-radius:50%;flex:none}
#pinCard .pcn{display:flex;gap:12px;font-size:12.5px;font-weight:700;color:var(--ink-2);margin-top:6px}
#pinCard .pcn span{display:inline-flex;align-items:center;gap:4px}
#pinCard .pcp{display:inline-block;margin-top:7px;font-size:12px;font-weight:800;color:#c45a85;background:#fff0f5;border-radius:999px;padding:2px 9px}
.nshadow{fill:rgba(79,72,107,.16)}
.nnum{font:400 16px var(--font-pixel);fill:var(--ink)}
.nlabel rect{fill:#fff;stroke:var(--line);stroke-width:1.5}
.nlabel text{font:700 13px var(--font-body);fill:var(--ink)}
.node.dim{opacity:.55}
.node .ring{fill:none;stroke-width:3;opacity:0;transform-box:fill-box;transform-origin:center}
.node.sel .ring{opacity:1;animation:ring 1.8s ease-out infinite}
@keyframes ring{0%{transform:scale(.8);opacity:.9}100%{transform:scale(1.5);opacity:0}}
.node.arrive .face{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.7)}100%{transform:scale(1)}}
.spark{transform-box:fill-box;transform-origin:center;animation:spark .8s ease-out forwards}
@keyframes spark{0%{opacity:1;transform:translate(0,0) scale(.4)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1)}}
#balloon{pointer-events:none}
#balloon .bob{animation:bob 3.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-5px)}}
.cloud{position:absolute;pointer-events:none;opacity:.75;animation:drift linear infinite}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}

/* ---------- HUD ---------- */
.hud{position:fixed;top:calc(14px + var(--safe-t));left:16px;z-index:15;display:flex;flex-direction:column;gap:10px;max-width:calc(100% - 480px);pointer-events:none}
.hud>*{pointer-events:auto}
.plaque{display:flex;align-items:center;gap:12px;background:var(--paper);border:3px solid #fff;border-radius:22px;padding:10px 16px 10px 12px;box-shadow:var(--shadow);width:max-content;max-width:100%}
.plaque h1{font:800 26px/1 var(--font-display);letter-spacing:.2px;color:var(--ink)}
.stats{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px;font-size:13px;color:var(--ink-2);font-weight:600}
.stats b{font:400 17px var(--font-pixel);color:var(--accent-deep);margin-right:4px}
.tripbar{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:8px;padding:7px 14px 7px 10px;border-radius:999px;border:0;background:var(--card);font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 3px 0 var(--line);white-space:nowrap;transition:transform .12s}
.chip:active{transform:translateY(2px)}
.chip .dot{width:14px;height:14px;border-radius:50%;background:var(--c,var(--lav));box-shadow:inset 0 -2px 0 rgba(0,0,0,.12)}
.chip[aria-pressed="true"]{background:var(--c-soft,var(--accent-soft));box-shadow:0 3px 0 var(--c-deep,var(--accent-deep)),inset 0 0 0 2px var(--c-deep,var(--accent-deep))}
.chip.add{color:var(--ink-2);background:rgba(255,255,255,.7)}
.status .btn{min-height:32px;padding:4px 12px;margin-left:4px;font-size:13px}
.status.ok{background:var(--mint);box-shadow:0 3px 0 #9fd3b9}
.status.bad{background:var(--pink);box-shadow:0 3px 0 #eaa3b8}
.status{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:14px;background:var(--butter);font-size:14px;font-weight:600;box-shadow:0 3px 0 #ecd58a;width:max-content;max-width:100%}

/* ---------- map buttons ---------- */
.mapctl{position:fixed;left:16px;bottom:calc(18px + var(--safe-b));z-index:14;display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.zoom{display:flex;flex-direction:column;background:var(--card);border-radius:18px;box-shadow:0 4px 0 var(--line),var(--shadow);overflow:hidden}
.zoom button{width:44px;height:42px;border:0;background:none;display:grid;place-items:center;cursor:pointer}
.zoom button+button{border-top:2px solid var(--line)}
.zoom button:hover{background:var(--accent-soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:9px 18px;border-radius:999px;border:0;background:var(--card);color:var(--ink);font-weight:700;font-size:15px;line-height:1.1;cursor:pointer;box-shadow:0 4px 0 var(--line),0 0 0 2px var(--line) inset;transition:transform .1s,box-shadow .1s;text-decoration:none}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line),0 0 0 2px var(--line) inset}
.btn.primary{background:var(--accent);color:#3c3459;box-shadow:0 4px 0 var(--accent-deep)}
.btn.primary:active{box-shadow:0 1px 0 var(--accent-deep)}
.btn.ghost{background:transparent;box-shadow:none;padding:8px 12px;min-height:40px}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.danger{color:#b4486b}
.btn.small{min-height:36px;padding:6px 12px;font-size:14px}
.btn.icon{width:40px;min-height:40px;padding:0}
.btn[disabled]{opacity:.45;pointer-events:none}
.mapctl .btn{box-shadow:0 4px 0 var(--line),var(--shadow)}
.mapctl .btn.primary{box-shadow:0 4px 0 var(--accent-deep),var(--shadow)}

/* ---------- panel ---------- */
#panel{position:fixed;top:calc(14px + var(--safe-t));right:16px;bottom:calc(14px + var(--safe-b));width:min(430px,calc(100% - 32px));background:var(--paper);border:3px solid #fff;border-radius:28px;box-shadow:var(--shadow);display:flex;flex-direction:column;z-index:20;transition:transform .38s cubic-bezier(.2,.85,.25,1)}
body.panel-hidden #panel{transform:translateX(calc(100% + 16px))}
#panelBody{flex:1;overflow-y:auto;padding:18px 22px 28px;overscroll-behavior:contain;scrollbar-width:thin}
.panelToggle{position:absolute;left:-52px;top:16px;width:44px;height:44px;border-radius:50%;border:0;background:var(--paper);box-shadow:0 4px 0 var(--line),var(--shadow);cursor:pointer;display:grid;place-items:center}
body.panel-hidden .panelToggle svg{transform:scaleX(-1)}
.sheetHandle{display:none;justify-content:center;padding:10px 0 2px;cursor:grab;touch-action:none}
.sheetHandle span{width:44px;height:5px;border-radius:9px;background:var(--line)}

.navrow{display:flex;align-items:center;gap:6px;margin:-4px -6px 10px}
.navrow .count{flex:1;text-align:center;font:400 14px var(--font-pixel);color:var(--ink-2);letter-spacing:.5px}
.eyebrow{font:400 13px var(--font-pixel);letter-spacing:1px;color:var(--accent-deep);text-transform:uppercase}
.phead{display:flex;gap:14px;align-items:flex-start;margin-bottom:14px}
.phead .txt{flex:1;min-width:0}
.phead h2{font:800 34px/1.02 var(--font-display);margin:2px 0 6px;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--ink-2);font-size:14px;font-weight:600}
.meta .i{color:var(--accent-deep);margin-right:3px;vertical-align:-3px}
.note{margin:8px 0 0;font-size:15px}
.stamp{flex:none;transform:rotate(-8deg)}
.stamp.thump{animation:thump .55s cubic-bezier(.2,1.4,.4,1)}
@keyframes thump{0%{transform:rotate(-20deg) scale(1.7);opacity:0}60%{opacity:1}100%{transform:rotate(-8deg) scale(1)}}
.stp text{font-family:var(--font-body);font-weight:800}
.stp .yr{font-family:var(--font-pixel);font-weight:400}
.stampph{flex:none;width:92px;height:92px;border-radius:50%;border:3px dashed #f3b6c9;background:#fff5f8;display:grid;place-items:center;text-align:center;font-size:11px;font-weight:800;color:#c45a85;line-height:1.15;padding:12px;transform:rotate(-8deg)}

.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--line);padding:4px;border-radius:18px;margin:6px 0 16px;position:sticky;top:0;z-index:2;box-shadow:0 -10px 0 var(--paper)}
.tab{border:0;background:transparent;border-radius:14px;padding:7px 2px 6px;font-weight:700;font-size:13px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--ink-2)}
.tab[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 2px 0 var(--accent-deep)}
.tab .n{font:400 12px var(--font-pixel);color:var(--accent-deep)}

.empty{text-align:center;padding:20px 12px;color:var(--ink-2);font-size:15px;border:2.5px dashed var(--line);border-radius:22px;margin-bottom:14px}
.empty svg{margin:0 auto 6px;color:var(--accent-deep)}
.empty p{margin:4px 0 0}
.section-h{display:flex;align-items:center;justify-content:space-between;margin:20px 0 10px}
.section-h h3{font:800 19px var(--font-display)}

/* photos */
.uploader{display:flex;align-items:center;justify-content:center;gap:10px;padding:14px;border:2.5px dashed var(--accent);border-radius:20px;background:var(--accent-soft);font-weight:700;cursor:pointer;margin-bottom:14px;text-align:center}
.uploader.over{background:var(--accent);border-style:solid}
.uploader input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.progress{height:10px;border-radius:9px;background:var(--line);overflow:hidden;margin:-4px 0 14px}
.progress span{display:block;height:100%;background:var(--accent-deep);border-radius:9px;transition:width .3s}
.progress-l{font-size:13px;color:var(--ink-2);margin:0 0 6px;font-weight:600}
.grid{columns:2 140px;column-gap:12px}
.polaroid{display:block;width:100%;break-inside:avoid;margin:0 0 14px;padding:7px 7px 9px;border:0;background:#fff;border-radius:10px;box-shadow:0 3px 10px rgba(79,72,107,.14);cursor:zoom-in;transform:rotate(var(--r,0deg));transition:transform .2s;position:relative;text-align:left}
.polaroid:hover{transform:rotate(0) scale(1.03);z-index:1}
.polaroid img{display:block;width:100%;height:auto;border-radius:5px;background:var(--line);aspect-ratio:var(--ar,4/3);object-fit:cover}
.polaroid .cap{display:block;font-size:13px;margin-top:5px;line-height:1.25;font-weight:600}
.polaroid .cov{position:absolute;top:2px;right:2px;background:var(--butter);border-radius:50%;padding:4px;box-shadow:0 2px 0 #e4cd7c}

/* lists */
.daygrp{margin-bottom:14px}
.dayh{font:400 13px var(--font-pixel);letter-spacing:.6px;color:var(--accent-deep);text-transform:uppercase;margin:0 0 6px 4px}
.item{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;background:var(--card);border-radius:16px;box-shadow:0 2px 0 var(--line);margin-bottom:8px}
.item .body{flex:1;min-width:0;cursor:default;overflow-wrap:anywhere}
.item.editable .body{cursor:pointer}
.item.done .body .t{text-decoration:line-through;text-decoration-thickness:2px;color:var(--ink-2)}
.time{display:inline-block;font:400 13px var(--font-pixel);background:var(--accent-soft);color:var(--accent-deep);padding:2px 6px;border-radius:7px;margin-right:6px;vertical-align:1px}
.chk{flex:none;width:26px;height:26px;border-radius:9px;border:2.5px solid var(--accent);background:#fff;display:grid;place-items:center;cursor:pointer;padding:0;margin-top:1px;color:#fff}
.chk[aria-checked="true"]{background:var(--accent-deep);border-color:var(--accent-deep)}
.chk[disabled]{cursor:default}
.kind{display:inline-block;font-size:12px;font-weight:800;padding:1px 9px;border-radius:999px;margin-right:6px;background:var(--kc,var(--line));color:#4a4262}
.memo{position:relative;padding:16px 16px 12px 58px;border-radius:20px;margin-bottom:12px;background:var(--mc,#fff);box-shadow:0 3px 0 rgba(79,72,107,.08)}
.memo.editable{cursor:pointer}
.memo .mood{position:absolute;left:14px;top:12px;font-size:30px;line-height:1}
.memo p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15.5px}
.memo .sig{margin-top:8px;font-size:13px;color:var(--ink-2);font-weight:700}
.memo.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%,40%{box-shadow:0 0 0 4px var(--accent-deep)}100%{box-shadow:0 3px 0 rgba(79,72,107,.08)}}
.addrow{display:flex;justify-content:center;margin:6px 0 4px}

/* trip overview */
.route{list-style:none;margin:0;padding:0;position:relative}
.route::before{content:"";position:absolute;left:23px;top:26px;bottom:26px;border-left:3px dotted var(--accent)}
.stop{display:flex;align-items:center;gap:12px;padding:8px 6px;border-radius:18px;position:relative}
.stop:hover{background:var(--accent-soft)}
.stop .go{display:flex;align-items:center;gap:12px;flex:1;min-width:0;border:0;background:none;padding:0;text-align:left;cursor:pointer}
.badge{flex:none;width:36px;height:36px;border-radius:50%;background:#fff;border:3px solid var(--accent-deep);display:grid;place-items:center;font:400 16px var(--font-pixel);box-shadow:0 3px 0 var(--accent-deep);overflow:hidden;margin-left:2px}
.badge img{width:100%;height:100%;object-fit:cover}
.badge.home{border-color:var(--ink-2);box-shadow:0 3px 0 var(--ink-2)}
.stop .nm{font-weight:800;font-size:17px;line-height:1.15}
.stop .sub{font-size:13px;color:var(--ink-2);font-weight:600}
.stop .ord{display:flex;flex-direction:column}
.stop .ord button{border:0;background:none;padding:1px 4px;cursor:pointer;color:var(--ink-2);border-radius:6px}
.stop .ord button:hover{background:#fff;color:var(--ink)}
.stop .warn{color:#b4486b}
.tripcard{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border:0;border-radius:20px;background:#fff;box-shadow:0 3px 0 var(--line);margin-bottom:10px;cursor:pointer;text-align:left}
.tripcard .sw{width:44px;height:44px;border-radius:14px;background:var(--c);box-shadow:inset 0 -4px 0 rgba(0,0,0,.1);flex:none}
.tripcard b{display:block;font-size:17px;line-height:1.2}
.tripcard span{font-size:13px;color:var(--ink-2);font-weight:600}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 4px}

/* countries */
.bigt{font:800 32px/1.05 var(--font-display);margin:4px 0 8px}
.ccard{display:flex;align-items:center;gap:14px;width:100%;padding:10px 14px 10px 10px;border:0;border-radius:20px;background:#fff;box-shadow:0 3px 0 var(--line);margin-bottom:10px;cursor:pointer;text-align:left}
.ccard:hover{background:var(--accent-soft)}
.ccard b{display:block;font-size:17px;line-height:1.2}
.ccard span{font-size:13px;color:var(--ink-2);font-weight:600}
.sticker{flex:none;filter:drop-shadow(0 2px 0 rgba(79,72,107,.18));overflow:visible}
.sticker.blank{display:block;border-radius:40%;background:var(--c);border:3px solid #fff}
.stickerbig{flex:none;transform:rotate(-6deg)}
.years{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.years span{font:400 13px var(--font-pixel);background:var(--accent-soft);color:var(--accent-deep);padding:3px 8px;border-radius:8px}
.timeline{position:relative;padding-left:28px}
.timeline::before{content:"";position:absolute;left:9px;top:10px;bottom:10px;border-left:3px dotted var(--accent)}
.year{position:relative;font:400 18px var(--font-pixel);color:var(--accent-deep);margin:16px 0 10px}
.year:first-child{margin-top:4px}
.year::before{content:"";position:absolute;left:-25px;top:1px;width:15px;height:15px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px var(--paper),0 2px 0 var(--accent-deep)}
.entry{background:#fff;border-radius:20px;box-shadow:0 3px 0 var(--line);padding:12px;margin-bottom:12px;display:flex;flex-direction:column;gap:10px}
.entry-head{display:flex;align-items:center;gap:12px;border:0;background:none;padding:0;text-align:left;cursor:pointer;width:100%}
.entry-head .nm{font-weight:800;font-size:18px;line-height:1.15}
.entry-head .sub{font-size:13px;color:var(--ink-2);font-weight:600}
.thumb{width:54px;height:54px;border-radius:16px;flex:none;object-fit:cover;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent-deep)}
.strip{display:flex;gap:6px;flex-wrap:wrap}
.strip button{width:58px;height:58px;padding:0;border:0;border-radius:12px;overflow:hidden;cursor:zoom-in;background:var(--line);flex:none}
.strip img{width:100%;height:100%;object-fit:cover;display:block}
.strip .more{cursor:pointer;font:400 14px var(--font-pixel);color:var(--accent-deep);background:var(--accent-soft)}
.snip{display:flex;gap:8px;align-items:flex-start;text-align:left;border:0;background:var(--accent-soft);border-radius:14px;padding:8px 12px;cursor:pointer;font-size:14.5px;width:100%}
.snip .mood{font-size:18px;line-height:1.2}
.snip .txt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.links{display:flex;gap:8px;flex-wrap:wrap}
.tiprow{display:flex;align-items:flex-start;gap:6px;flex-wrap:wrap;width:100%;border:0;background:#fff;border-radius:16px;box-shadow:0 2px 0 var(--line);padding:10px 12px;margin-bottom:8px;text-align:left;cursor:pointer;font-size:15px}
.tiprow small{color:var(--ink-2);font-weight:700;margin-left:auto}

/* form widgets: city search + date picker */
.ac-list{margin-top:6px;background:#fff;border:2.5px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 3px 0 var(--line)}
.ac-item{display:flex;align-items:baseline;gap:8px;width:100%;border:0;background:none;padding:12px 14px;text-align:left;font-size:16px;font-weight:700;cursor:pointer;color:var(--ink)}
.ac-item+.ac-item{border-top:1.5px solid var(--line)}
.ac-item span{font-size:13px;color:var(--ink-2);font-weight:600}
.ac-item.on,.ac-item:hover{background:var(--accent-soft)}
.ac-empty{padding:10px 14px;font-size:14px;color:var(--ink-2);font-weight:600}
.datef{display:flex;gap:8px}
.datef input{flex:1;min-width:0;letter-spacing:.5px}
.calbtn{flex:none;width:48px;min-height:46px;border-radius:14px}
.calbtn[aria-expanded="true"]{background:var(--accent);box-shadow:0 3px 0 var(--accent-deep)}
.cal{margin-top:8px;background:#fff;border:2.5px solid var(--line);border-radius:18px;padding:8px 10px 6px;box-shadow:0 3px 0 var(--line)}
.calhead{display:flex;align-items:center;gap:2px;margin-bottom:4px}
.calhead b{flex:1;text-align:center;font-weight:800;font-size:16px}
.calnav{width:38px;height:38px;border:0;background:none;border-radius:12px;display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.calnav:hover{background:var(--accent-soft);color:var(--ink)}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center}
.dow{font:400 12px var(--font-pixel);color:var(--ink-2);padding:4px 0}
.day{height:40px;border:0;border-radius:12px;background:none;font:700 15px var(--font-body);cursor:pointer;color:var(--ink);padding:0}
.day:hover{background:var(--accent-soft)}
.day.today{box-shadow:inset 0 0 0 2px var(--accent)}
.day.on{background:var(--accent-deep);color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.calfoot{display:flex;justify-content:space-between;margin-top:4px}

.exportcard{margin-top:22px;padding:14px 16px;border:2.5px dashed var(--line);border-radius:20px;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.exportcard b{font:800 17px var(--font-display)}
.exportcard p{margin:0 0 4px;font-size:14px;color:var(--ink-2)}

/* badges */
.badgeimg{display:block;object-fit:contain;filter:drop-shadow(0 3px 0 rgba(79,72,107,.14))}
.badgebig{flex:none;border:0;background:none;padding:0;cursor:pointer;transition:transform .2s}
.badgebig:hover{transform:rotate(-4deg) scale(1.05)}
.badgebig .badgeimg{width:118px;height:118px}
.ccard .badgeimg{width:58px;height:58px;flex:none;margin:-4px 0}
.ccard .st{color:var(--accent-deep);letter-spacing:1px;margin-left:4px}
.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:#fff;border-radius:20px;padding:12px 8px 10px;box-shadow:0 3px 0 var(--line)}
.tier{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.tier .badgeimg{width:84px;height:84px}
.tier.locked .badgeimg{filter:grayscale(1) opacity(.35)}
.tier small{font-size:12px;font-weight:800;color:var(--ink-2);line-height:1.2}
.tier.on small{color:var(--accent-deep)}
.badgeprog{font-size:14px;color:var(--ink-2);font-weight:600;margin:10px 4px 0}
.newbadge{text-align:center}
.newbadge .badgeimg{width:min(240px,70vw);height:min(240px,70vw);margin:4px auto 6px;animation:badgepop .9s cubic-bezier(.2,1.5,.4,1)}
@keyframes badgepop{0%{transform:scale(.25) rotate(-30deg);opacity:0}100%{transform:none;opacity:1}}
.newbadge h3{margin:4px 0 2px}
.newbadge .acts{justify-content:center}
.pbadges{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px;margin:6px 0 4px}
.pbadge{border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px;border-radius:16px}
.pbadge:hover{background:var(--accent-soft)}
.pbadge .badgeimg{width:96px;height:96px}
.pbadge small{font-size:12px;font-weight:800;color:var(--ink-2)}
.passport h4{font:800 18px var(--font-display);margin:14px 0 4px}
@media (max-width:760px){.badgebig .badgeimg{width:96px;height:96px}.tier .badgeimg{width:72px;height:72px}}

/* stamps card + rewards */
.scard{background:#fff;border-radius:20px;padding:14px 12px 12px;box-shadow:0 3px 0 var(--line);margin-top:10px}
.slots{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px 8px}
.slot{position:relative;aspect-ratio:1;min-width:0;border:0;background:none;padding:0;display:grid;place-items:center}
.slot .empty{width:100%;height:100%;border-radius:50%;border:2.5px dashed var(--line);display:grid;place-items:center}
.slot.pending{cursor:pointer}
.slot.pending .empty{border-color:#f3b6c9;background:#fff5f8;font:400 12px var(--font-pixel);color:#c45a85;animation:pendpulse 1.8s ease-in-out infinite}
@keyframes pendpulse{50%{transform:scale(1.07)}}
.slot.got{cursor:pointer}
.slot.got svg{width:100%;height:100%;transform:rotate(var(--r,0deg));filter:drop-shadow(0 2px 0 rgba(79,72,107,.12))}
.slot .ms{position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);font-size:9px;line-height:1;background:var(--butter);border-radius:8px;padding:2px 5px;white-space:nowrap;box-shadow:0 1px 0 #e4cd7c;color:#8a6d12;font-weight:800}
.scard p{margin:14px 2px 0;font-size:14px;font-weight:600;color:var(--ink-2)}
.pchip{display:inline-block;margin-top:3px;font-size:12px;font-weight:800;color:#c45a85;background:#fff0f5;border-radius:999px;padding:1px 9px}
.pendg{animation:pendbob 1.6s ease-in-out infinite}
@keyframes pendbob{50%{transform:translateY(-2.5px)}}
.pendg text{font:400 8px var(--font-pixel);fill:#fff}
.locked{filter:grayscale(1) opacity(.4)}
.reward{text-align:center;overflow:hidden;position:relative}
.reward h3{margin:2px 0 0}
.rstage{position:relative;height:310px;margin:6px 0 4px}
.rstamp{position:absolute;left:50%;top:0;width:150px;height:150px;margin-left:-75px;transform:rotate(-8deg);animation:rstampin .55s cubic-bezier(.2,1.4,.4,1) both}
.rstamp svg{width:150px;height:150px;filter:drop-shadow(0 4px 0 rgba(79,72,107,.15))}
@keyframes rstampin{0%{transform:rotate(-24deg) scale(1.9);opacity:0}60%{opacity:1}100%{transform:rotate(-8deg) scale(1)}}
.rstamp.fly{animation:none;transition:transform .6s cubic-bezier(.55,0,.8,.3),opacity .6s ease-in;transform:translateY(165px) rotate(14deg) scale(.2);opacity:0}
.rplus{position:absolute;left:calc(50% + 62px);top:6px;font:400 29px var(--font-pixel);color:#d0608a;opacity:0;animation:rplus 1.1s .4s ease-out forwards}
@keyframes rplus{0%{opacity:0;transform:translateY(10px)}25%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
.rbadge{position:absolute;left:50%;bottom:0;width:150px;height:150px;margin-left:-75px;display:grid;place-items:center}
.rbin{transition:transform .7s cubic-bezier(.3,1.3,.5,1)}
.rbadge.grow .rbin{transform:translateY(-62px) scale(1.4)}
.rbadge .badgeimg,.rbadge .sticker{width:150px;height:150px;transition:filter .6s}
.rbadge.bump{animation:rbump .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes rbump{40%{transform:scale(1.13)}}
.rbadge.unlock .badgeimg,.rbadge.unlock .sticker{animation:badgepop .8s cubic-bezier(.2,1.5,.4,1)}
.rs{position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px;background:var(--c);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:rsp .9s ease-out forwards}
@keyframes rsp{0%{transform:translate(0,0) scale(.3);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.1);opacity:0}}
.rbar{height:14px;border-radius:9px;background:var(--line);overflow:hidden;margin:6px 24px 0}
.rbar span{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffb3c9,var(--accent-deep));border-radius:9px;transition:width .8s cubic-bezier(.3,.9,.3,1)}
.rtxt{font-weight:800;margin:8px 0 0;font-variant-numeric:tabular-nums}
.rsub{font-size:14px;color:var(--ink-2);margin:2px 0 0;font-weight:600}
.reward .acts{justify-content:center;visibility:hidden}
.reward .acts.show{visibility:visible;animation:fade .3s}

/* travelers */
.persp{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.persp:empty{display:none}
.pav{display:inline-flex;align-items:center;gap:6px;border:0;background:#fff;border-radius:999px;padding:3px 11px 3px 3px;font:700 13px var(--font-body);color:var(--ink-2);cursor:pointer;box-shadow:0 2px 0 var(--line);transition:transform .1s}
.pav:active{transform:translateY(2px)}
.av{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;background:var(--c,var(--line));font-size:15px;line-height:1;flex:none;color:var(--ink)}
.pav[aria-pressed="true"]{color:var(--ink);box-shadow:0 2px 0 var(--cd,var(--accent-deep)),inset 0 0 0 2px var(--cd,var(--accent-deep))}
.avs{display:inline-flex;align-items:center}
.avs .av{width:24px;height:24px;font-size:13px;box-shadow:0 0 0 2px var(--paper)}
.avs .av+.av{margin-left:-6px}
.tcard{background:#fff;border-radius:22px;padding:14px;box-shadow:0 3px 0 var(--line);margin-bottom:12px}
.tcard .top{display:flex;align-items:center;gap:12px}
.tcard .top>.av{width:52px;height:52px;font-size:28px}
.tcard h4{margin:0;font:800 22px var(--font-display)}
.tcard .me{font-size:11px;font-weight:800;background:var(--butter);border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:4px;font-family:var(--font-body)}
.tstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(78px,1fr));gap:6px;margin:12px 0 8px}
.tstats div{background:var(--paper);border-radius:14px;padding:6px 8px}
.tstats b{display:block;font:400 20px var(--font-pixel);color:var(--accent-deep)}
.tstats span{font-size:12px;font-weight:700;color:var(--ink-2)}
.tbadges{display:flex;gap:4px;flex-wrap:wrap;margin:4px 0 8px}
.tbadges img{width:48px;height:48px}
.ttrips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.ttrips span{font-size:13px;font-weight:700;background:var(--c-soft,var(--accent-soft));border-radius:999px;padding:2px 10px}
.tcard .acts{margin-top:0;justify-content:flex-start}
.who{display:flex;gap:8px;flex-wrap:wrap}
.who-btn{display:inline-flex;align-items:center;gap:6px;border:2.5px solid var(--line);background:#fff;border-radius:999px;padding:3px 12px 3px 3px;font-weight:800;font-size:14px;cursor:pointer;color:var(--ink-2)}
.who-btn[aria-pressed="true"]{border-color:var(--cd,var(--accent-deep));color:var(--ink);background:var(--cs,var(--accent-soft))}
.rwho{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:6px;font-size:13px;font-weight:700;color:var(--ink-2);flex-wrap:wrap}
.pav.grp{background:var(--paper)}

.ssec{background:#fff;border-radius:22px;padding:14px;box-shadow:0 3px 0 var(--line);margin-top:12px}
.ssec h4{margin:0 0 8px;font:400 13px var(--font-pixel);letter-spacing:1px;text-transform:uppercase;color:var(--ink-2)}
.sbig b{display:block;font:800 30px/1.05 var(--font-display);color:var(--ink)}
.sbig span{display:block;font-size:13px;line-height:1.35;font-weight:700;color:var(--ink-2);margin-top:2px}
.sbar{height:12px;border-radius:9px;background:var(--line);overflow:hidden;margin:8px 0 2px;flex:1;min-width:40px}
.sbar span{display:block;height:100%;background:linear-gradient(90deg,#ffb3c9,#a993e6);border-radius:9px}
.ssub{font-size:13px;font-weight:700;color:var(--ink-2);margin:2px 0 6px}
.srows{display:grid;gap:4px;margin-top:6px}
.srow{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;background:var(--paper);border-radius:12px;padding:5px 10px}
.srow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow b{font-variant-numeric:tabular-nums;white-space:nowrap}
.srow .dot{width:10px;height:10px;border-radius:50%;flex:none}
.srow .sbar{margin:0;height:10px}
.srow.yr .y{font:400 17px var(--font-pixel);flex:none;width:52px}
.srow.ct .sbar{flex:none;width:110px}
.srow.off{opacity:.55}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ctile{border:0;text-align:left;background:var(--paper);border-radius:14px;padding:8px 10px;cursor:pointer;font:inherit;color:var(--ink);display:flex;flex-direction:column;gap:1px}
.ctile:hover{background:var(--accent-soft)}
.ctile small{font-size:12px;font-weight:800;color:var(--ink-2)}
.ctile b{font:800 17px/1.15 var(--font-display)}
.ctile span{font-size:12px;font-weight:700;color:var(--ink-2)}
.ctile.wide{width:100%;margin-top:6px}
.agrid{display:grid;gap:8px}
.acard .achimg,.acard .achsvg{flex:none}
.acard{display:flex;gap:12px;align-items:center;background:var(--paper);border-radius:16px;padding:8px 12px 8px 8px}
.acard .abody{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1}
.acard b{font:800 17px var(--font-display)}
.acard .st{font:400 14px var(--font-body);color:#e5b93a;margin-left:6px;letter-spacing:1px}
.acard small{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.acard .anext{color:var(--ink)}
.acard .asteps{font-size:11.5px;opacity:.8}
.acard .sbar{margin:3px 0 1px;height:8px;flex:none}
.achsvg{flex:none;display:block;filter:drop-shadow(0 3px 0 rgba(79,72,107,.14))}
.achsvg.locked,.achimg.locked{filter:grayscale(1) opacity(.45)}
@media (max-width:760px){.srow.ct .sbar{width:64px}.sbig b{font-size:26px}}
.ylegend{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:-4px 0 14px}
.ylbl{font-size:12px;font-weight:700;color:var(--ink-2);margin-right:2px}
.ychip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;color:var(--cd);background:#fff;border-radius:999px;padding:2px 9px 2px 4px;box-shadow:0 2px 0 var(--line)}
.ychip i{width:14px;height:14px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1.5px var(--cd)}
.pav.grp .av{box-shadow:0 0 0 2px #fff}
.tsec{font:400 13px var(--font-pixel);letter-spacing:1px;text-transform:uppercase;color:var(--ink-2);margin:14px 2px 8px}
.tsec:first-of-type{margin-top:4px}
.tmem{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--ink-2);margin-top:3px}
.tmile{display:grid;gap:5px;margin:0 0 10px}
.tmile div{background:var(--paper);border-radius:14px;padding:6px 10px;font-size:14px;font-weight:800;line-height:1.3}
.tmile small{display:block;font-size:11px;color:var(--ink-2);font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.tmile em{font-style:normal;font-size:12px;color:var(--ink-2);font-weight:700;white-space:nowrap}
.tcmp{width:100%;border-collapse:separate;border-spacing:0 4px;margin:0 0 8px;font-size:13px}
.tcmp th{font-size:11px;color:var(--ink-2);font-weight:800;text-align:right;padding:0 8px}
.tcmp td{background:var(--paper);padding:5px 8px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.tcmp td:first-child{text-align:left;border-radius:12px 0 0 12px;white-space:nowrap}
.tcmp td:last-child{border-radius:0 12px 12px 0}
.tcmp tr.sum td{background:var(--accent-soft);font-weight:800}
.tcmp .av{width:20px;height:20px;font-size:12px}
.tcmp .tn{display:inline-flex;align-items:center;gap:6px}
.tgroups{display:flex;gap:6px;flex-wrap:wrap;margin:-2px 0 10px}
.tgroups span{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;color:var(--ink-2);background:var(--paper);border-radius:999px;padding:2px 9px 2px 2px}
.tgroups .av{width:20px;height:20px;font-size:12px}
.ghint{font-size:13px;font-weight:700;color:var(--ink-2);margin:6px 0 0}

/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;z-index:65;background:rgba(79,72,107,.36);display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--paper);border:3px solid #fff;border-radius:28px;box-shadow:var(--shadow);width:min(480px,100%);max-height:calc(100% - 20px);overflow:auto;padding:22px 22px 18px;animation:rise .28s cubic-bezier(.2,1.2,.4,1)}
@keyframes rise{from{transform:translateY(16px) scale(.97);opacity:0}}
.modal h3{font:800 24px var(--font-display);margin-bottom:14px}
.modal .acts{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}
.modal .acts .spacer{flex:1}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.fld label,.fld .lbl{font-size:13px;font-weight:800;color:var(--ink-2)}
.fld input,.fld textarea,.fld select{font:600 16px var(--font-body);color:var(--ink);padding:10px 12px;border-radius:14px;border:2.5px solid var(--line);background:#fff;width:100%}
.fld input:focus,.fld textarea:focus{outline:none;border-color:var(--accent-deep)}
.fld textarea{min-height:110px;resize:vertical;line-height:1.4}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.swatches,.moods,.kinds{display:flex;gap:8px;flex-wrap:wrap}
.sw-btn{width:38px;height:38px;border-radius:12px;border:0;background:var(--c);cursor:pointer;box-shadow:inset 0 -4px 0 rgba(0,0,0,.1)}
.sw-btn[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:2px}
.mood-btn{font-size:24px;width:46px;height:46px;border-radius:14px;border:2.5px solid var(--line);background:#fff;cursor:pointer;padding:0}
.mood-btn[aria-pressed="true"]{border-color:var(--accent-deep);background:var(--accent-soft)}
.kind-btn{border:2.5px solid transparent;background:var(--kc);border-radius:999px;padding:5px 12px;font-weight:800;font-size:14px;cursor:pointer}
.kind-btn[aria-pressed="true"]{border-color:var(--ink)}
.coords{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px;font-weight:600;color:var(--ink-2)}
.err{color:#b4486b;font-weight:700;font-size:14px;margin:6px 0 0}
.hint{font-size:13px;color:var(--ink-2);margin:2px 0 0}

#lightbox{position:fixed;inset:0;z-index:60;background:rgba(48,42,70,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:56px 12px 12px;animation:fade .2s;touch-action:pan-y}
#lightbox figure{margin:0;display:flex;flex-direction:column;align-items:center;max-width:100%;max-height:100%;min-height:0}
#lightbox .frame{background:#fff;padding:10px 10px 14px;border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.35);display:flex;flex-direction:column;min-height:0;max-height:100%}
#lightbox img{max-width:min(92vw,1100px);max-height:calc(100vh - 230px);object-fit:contain;border-radius:6px;display:block;margin:0 auto}
#lightbox figcaption{display:flex;flex-direction:column;gap:8px;padding-top:10px;width:100%}
#lightbox .capin{font:600 16px var(--font-body);border:0;border-bottom:2px dashed var(--line);padding:4px 2px;color:var(--ink);background:transparent;width:100%}
#lightbox .capin:focus{outline:none;border-bottom-color:var(--accent-deep)}
#lightbox .lbbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#lightbox .lbbar .ct{flex:1;font:400 14px var(--font-pixel);color:var(--ink-2)}
.lbnav{position:absolute;top:50%;transform:translateY(-50%);width:50px;height:50px;border-radius:50%;border:0;background:rgba(255,255,255,.92);display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.lbnav.prev{left:14px}.lbnav.next{right:14px}
.lbclose{position:absolute;top:calc(12px + var(--safe-t));right:12px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.92);display:grid;place-items:center;cursor:pointer}

.passport{width:min(760px,100%)}
.stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:14px 8px;margin-top:8px}

.stampbtn:hover{background:var(--accent-soft)}
.stampbtn .stamp{transform:rotate(var(--r))}
.stampbtn small{font-size:12px;color:var(--ink-2);font-weight:700}
.pstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:4px 0 12px}
.pstat{background:#fff;border-radius:18px;padding:10px 12px;box-shadow:0 3px 0 var(--line)}
.pstat b{display:block;font:400 26px var(--font-pixel);color:var(--accent-deep)}
.pstat span{font-size:13px;font-weight:700;color:var(--ink-2)}
.countries{display:flex;flex-wrap:wrap;gap:6px}
.countries button{border:0;border-radius:999px;padding:4px 13px;font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 2px 0 rgba(79,72,107,.15)}

#toast{position:fixed;left:50%;bottom:calc(24px + var(--safe-b));transform:translateX(-50%);z-index:70;background:var(--ink);color:#fff;padding:10px 18px;border-radius:16px;font-weight:600;font-size:15px;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}
.pickbar{position:fixed;top:calc(14px + var(--safe-t));left:50%;transform:translateX(-50%);z-index:40;background:var(--ink);color:#fff;border-radius:18px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:12px;font-weight:700;box-shadow:var(--shadow);max-width:calc(100% - 24px)}
.pickbar .btn{min-height:36px}

/* ---------- phones ---------- */
@media (max-width:760px){
  .hud{max-width:calc(100% - 24px);left:12px;gap:8px}
  .plaque{padding:8px 12px 8px 8px;gap:8px;border-radius:18px}
  .plaque h1{font-size:19px}
  .plaque svg{width:34px;height:34px}
  .stats{font-size:12px;gap:2px 10px;margin-top:4px}
  .stats b{font-size:12px}
  .tripbar{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -12px;padding:0 12px 4px}
  .chip{font-size:13px;padding:6px 12px 6px 8px}
  #panel{top:auto;left:0;right:0;bottom:0;width:auto;height:min(86%,760px);border-radius:28px 28px 0 0;border-bottom:0;transform:translateY(calc(100% - var(--peek) - var(--safe-b)))}
  body.sheet-open #panel{transform:none}
  body.panel-hidden #panel{transform:translateY(calc(100% - var(--peek) - var(--safe-b)))}
  .panelToggle{display:none}
  .sheetHandle{display:flex}
  #panelBody{padding:4px 16px calc(24px + var(--safe-b))}
  .phead h2{font-size:28px}
  .mapctl{bottom:calc(var(--peek) + 12px + var(--safe-b));left:12px;gap:8px}
  .mapctl .btn{min-height:40px;padding:7px 13px;font-size:14px}
  .mapctl .btn .lbl{display:none}
  .mapctl .btn.primary .lbl{display:inline}
  .zoom button{width:40px;height:38px}
  .stamp svg{width:74px;height:74px}
  .lbnav{display:none}
  .overlay{align-items:flex-start;padding:calc(10px + var(--safe-t)) 8px 8px}

  .modal h3{font-size:22px;margin-bottom:10px}
  #toast{bottom:calc(var(--peek) + 20px)}
}

<script>
(() => {
'use strict';
const GEO = /*GEO*/null;

/* ================= helpers ================= */
const $ = (q, r = document) => r.querySelector(q);

function add(el, kids) {

}

}

const I = {

const nPl = (n, one, few, many) => `${n} ${plural(n, one, few, many)}`;

/* dates */
const MG = ['stycznia','lutego','marca','kwietnia','maja','czerwca','lipca','sierpnia','września','października','listopada','grudnia'];

function pd(s) { if (!s || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return null; const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }

  const A = pd(a), B = pd(b);

    if (+A === +B) return `${A.getDate()} ${MG[A.getMonth()]} ${A.getFullYear()}`;
    if (A.getFullYear() === B.getFullYear()) {
      if (A.getMonth() === B.getMonth()) return `${A.getDate()}–${B.getDate()} ${MG[A.getMonth()]} ${A.getFullYear()}`;
      return `${A.getDate()} ${MG[A.getMonth()]} – ${B.getDate()} ${MG[B.getMonth()]} ${A.getFullYear()}`;
    }
    return `${A.getDate()} ${MG[A.getMonth()]} ${A.getFullYear()} – ${B.getDate()} ${MG[B.getMonth()]} ${B.getFullYear()}`;

const yearOf = s => (pd(s) ? pd(s).getFullYear() : '');

/* ================= projection (Natural Earth I, same as the map geometry) ================= */
const RAD = Math.PI / 180;
function project(lat, lng) {
  const l = lng * RAD, p = lat * RAD, p2 = p * p, p4 = p2 * p2;
  const x = l * (0.8707 - 0.131979 * p2 + p4 * (-0.013791 + p4 * (0.003971 * p2 - 0.001529 * p4)));
  const y = p * (1.007226 + p2 * (0.015085 + p4 * (-0.044475 + 0.028874 * p2 - 0.005916 * p4)));
  return [GEO.t[0] + GEO.k * x, GEO.t[1] - GEO.k * y];
}

  const x = (X - GEO.t[0]) / GEO.k, y = (GEO.t[1] - Y) / GEO.k;
  let p = y, i = 25, d;
  do {
    const p2 = p * p, p4 = p2 * p2;
    d = (p * (1.007226 + p2 * (0.015085 + p4 * (-0.044475 + 0.028874 * p2 - 0.005916 * p4))) - y) /
      (1.007226 + p2 * (0.015085 * 3 + p4 * (-0.044475 * 7 + 0.028874 * 9 * p2 - 0.005916 * 11 * p4)));
    p -= d;
  } while (Math.abs(d) > 1e-9 && --i > 0);
  const p2 = p * p;
  const l = x / (0.8707 + p2 * (-0.131979 + p2 * (-0.013791 + p2 * p2 * p2 * (0.003971 - 0.001529 * p2))));
  return [clamp(p / RAD, -85, 85), clamp(l / RAD, -180, 180)];
}

/* ================= palettes & constants ================= */
const COLORS = {

  butter: { base: '#ffe59e', deep: '#cf9f22', soft: '#fff8e0', name: 'Masło' }
};
const col = k => COLORS[k] || COLORS.lav;
/* stamp & country colour by year: 10 pastel colours repeating every 10 years from 2016 (2016, 2026, 2036 = lavender…) */
const YEAR_COLORS = [
  { base: '#c9b8f2', deep: '#7a63c7', ink: '#7a63c7', soft: '#f1ecfd', name: 'lawendowy fiolet' },
  { base: '#ffe59e', deep: '#c29318', ink: '#a87b12', soft: '#fff8e0', name: 'maślany żółty' },
  { base: '#b4e6cf', deep: '#3f9d78', ink: '#3a8f6d', soft: '#e8f8f0', name: 'miętowy' },
  { base: '#ffc2d4', deep: '#d9638f', ink: '#cc5684', soft: '#fff0f5', name: 'różowy' },
  { base: '#b5daf5', deep: '#4a8fc4', ink: '#4384b8', soft: '#ebf5fd', name: 'błękitny' },
  { base: '#ffc7ad', deep: '#dd7a52', ink: '#cc6a42', soft: '#fff0e8', name: 'brzoskwiniowy' },
  { base: '#a8e3e6', deep: '#3a9ea6', ink: '#318d95', soft: '#e6f8f9', name: 'turkusowy' },
  { base: '#d2e6b0', deep: '#7a9c45', ink: '#6c8c3a', soft: '#f2f8e8', name: 'pistacjowy' },

async function prepImage(file) {

  catch (e) {

  if (src.close) src.close();
  return { full, thumb, w, h: hh };
}
async function uploadFiles(placeId, files) {
  if (!assets) return toast('Wgrywanie zdjęć jest dostępne tylko dla właścicielki mapy.');
  const list = [...(files || [])].filter(f => /^image\//.test(f.type) || /\.(jpe?g|png|webp|gif|heic|heif)$/i.test(f.name));
  if (!list.length) return toast('To nie wygląda na zdjęcia. Wybierz pliki JPG, PNG albo WEBP.');
  const job = S.uploads[placeId] = { total: list.length, done: 0, failed: 0 };
  render();
  let ok = 0, heic = false;
  const own = assets === folderAssets || assets === cloudAssets; // our own files get readable names; the Claude version names them itself
  const opt = name => (own ? { type: 'image/jpeg', name } : { type: 'image/jpeg' });
  for (const f of list) {
    try {
      const im = await prepImage(f);
      const nm = photoName(placeId);
      const a = await assets.upload(im.full, opt(nm));
      const b = await assets.upload(im.thumb, opt(THUMBS + '/' + nm));
      await patchPlace(placeId, d => { d.photos.push({ id: a.id, t: b.id, w: im.w, h: im.h, c: '', at: Date.now() }); if (!d.cover) d.cover = a.id; });
      ok++;
    } catch (e) {
      job.failed++;
      if (/heic|heif/i.test(f.name) || /heic|heif/i.test(f.type)) heic = true;
      if (e && (e.code === 'quota_or_state')) { toast('Skończyło się miejsce na zdjęcia w tej mapie.'); break; }
      if (e && e.code === 'forbidden') { toast('To konto może tylko oglądać mapę, więc zdjęcia się nie zapiszą.'); break; }
      if (e && e.code === 'auth') { toast('Sesja wygasła. Zaloguj się ponownie i dodaj zdjęcia jeszcze raz.'); break; }
      if (e && e.code === 'rate_limited') await sleep(2500);
      console.warn('upload failed', e);
    }
    job.done++;
    scheduleRender();
  }
  delete S.uploads[placeId];
  render();
  if (heic) toast('Część zdjęć była w formacie HEIC. Zapisz je jako JPG i spróbuj jeszcze raz.');
  else if (job.failed) toast(`Dodano ${nPl(ok, 'zdjęcie', 'zdjęcia', 'zdjęć')}, ${job.failed} się nie udało.`);
  else toast(`Dodano ${nPl(ok, 'zdjęcie', 'zdjęcia', 'zdjęć')}`);
}

/* city search: our own suggestion list right under the field, so it never covers the keyboard */
function cityField(id, label, value, onPick, hint, onType) {
  const input = inp(id, value, { autocomplete: 'off', autocorrect: 'off', autocapitalize: 'words', spellcheck: 'false', maxlength: 60, placeholder: 'Zacznij pisać, np. Lizb…', role: 'combobox', 'aria-autocomplete': 'list', 'aria-expanded': 'false', 'aria-controls': id + '-list' });
  const list = h('div', { class: 'ac-list', id: id + '-list', role: 'listbox', hidden: true });
  let items = [], act = -1, picked = norm(value);
  const close = () => { list.hidden = true; input.setAttribute('aria-expanded', 'false'); act = -1; };
  const pick = c => { input.value = c.n; picked = norm(c.n); close(); onPick(c); };
  const paint = () => {
    const q = norm(input.value);
    if (!q || q === picked) return close();
    items = CITIES.map(c => {
      const n = norm(c.n);
      const sc = n.startsWith(q) ? 0 : n.split(/[\s-]+/).some(w => w.startsWith(q)) ? 1 : n.includes(q) ? 2 : norm(c.c).startsWith(q) ? 3 : 9;
      return { c, sc };
    }).filter(x => x.sc < 9).sort((a, b) => a.sc - b.sc || a.c.n.localeCompare(b.c.n, 'pl')).slice(0, 6);
    list.replaceChildren(...(items.length
      ? items.map((x, i) => h('button', { type: 'button', class: 'ac-item' + (i === act ? ' on' : ''), role: 'option', 'aria-selected': String(i === act), tabindex: -1, onpointerdown: e => e.preventDefault(), onclick: () => pick(x.c) }, h('b', null, x.c.n), h('span', null, x.c.c)))
      : [h('div', { class: 'ac-empty' }, 'Nie mam tego miejsca na liście. Zostaw nazwę i wskaż je na mapie.')]));
    list.hidden = false; input.setAttribute('aria-expanded', 'true');
  };
  input.addEventListener('input', () => { picked = ''; act = -1; paint(); if (onType) onType(input.value); });
  input.addEventListener('focus', paint);
  input.addEventListener('blur', () => setTimeout(close, 200));
  input.addEventListener('keydown', e => {
    if (list.hidden || !items.length) return;
    if (e.key === 'ArrowDown') { e.preventDefault(); act = (act + 1) % items.length; paint(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); act = (act - 1 + items.length) % items.length; paint(); }
    else if (e.key === 'Enter' && act >= 0) { e.preventDefault(); pick(items[act].c); }
    else if (e.key === 'Escape') { e.stopPropagation(); close(); }
  });
  return h('div', { class: 'fld' }, h('label', { for: id }, label), input, list, hint ? h('p', { class: 'hint' }, hint) : null);
}

      h('div', { class: 'srows' }, [...st.perTrip].reverse().map(x => h('div', { class: 'srow' }, h('span', { class: 'dot', style: `background:${col(x.t.color).base}` }), h('span', { class: 'nm' }, x.t.title || 'Bez nazwy'), h('b', null, fmtKm(x.km)))))));
    // compass
    const C = st.compass, tile = (dir, arrow, p, coord) => (p ? h('button', { class: 'ctile', onclick: fly(p) }, h('small', null, arrow + ' ' + dir), h('b', null, p.name), h('span', null, coord(p))) : null);
    md.append(sec('Kompas',
      h('div', { class: 'cgrid' },
        tile('Północ', '⬆', C.n, p => degLat(p.lat)), tile('Południe', '⬇', C.s, p => degLat(p.lat)),
        tile('Zachód', '⬅', C.w, p => degLng(p.lng)), tile('Wschód', '➡', C.e, p => degLng(p.lng))),
      st.far ? h('button', { class: 'ctile wide', onclick: fly(st.far.p) }, h('small', null, '🧭 Najdalej od domu'), h('b', null, st.far.p.name), h('span', null, `${fmtKm(st.far.km)} od miasta ${st.home.name}`)) : null));
    // days per year
    md.append(sec('Dni w podróży',
      h('div', { class: 'sbig' }, h('b', null, nPl(st.days, 'dzień', 'dni', 'dni')), h('span', null, 'łącznie, bez liczenia tych samych dni dwa razy')),
      h('div', { class: 'srows' }, st.years.map(y => { const c = yearColor(y.y); return h('div', { class: 'srow yr' }, h('span', { class: 'y', style: `color:${c.ink}` }, String(y.y)), bar(y.pct, c.base), h('b', null, `${nPl(y.n, 'dzień', 'dni', 'dni')} · ${fmtPct(y.pct)} roku`)); }))));
    // share of the world
    const contKeys = ['EU', 'AS', 'AF', 'NA', 'SA', 'OC'].concat(st.conts.AN ? ['AN'] : []);
    const nCont = Object.keys(st.conts).length;
    md.append(sec('Procent świata',
      h('div', { class: 'sbig' }, h('b', null, fmtPct(st.sovereign / WORLD_COUNTRIES)), h('span', null, `${st.sovereign} z ${WORLD_COUNTRIES} krajów świata · ${nCont} z 7 kontynentów`)),
      h('div', { class: 'srows' }, contKeys.map(k => { const n = st.conts[k] ? st.conts[k].n : 0, tot = contTotal(k); return h('div', { class: 'srow ct' + (st.conts[k] ? '' : ' off') }, h('span', { class: 'nm' }, CONT_NAMES[k]), bar(tot ? n / tot : (st.conts[k] ? 1 : 0)), h('b', null, tot ? `${n} z ${tot}` : (st.conts[k] ? 'tak' : '–'))); }))));
    // achievements
    const grid = h('div', { class: 'agrid' });
    for (const a of ACHIEVEMENTS) {
      const r = achOf(a, st);
      const lvlTxt = r.tier >= r.max ? (r.max === 1 ? 'Zdobyta!' : 'Wszystkie poziomy zdobyte!') : `${r.max === 1 ? 'Cel' : `Do ${'★'.repeat(r.tier + 1)}`}: ${a.fmt(r.next)} · brakuje ${a.fmt(r.next - r.v)}`;
      const prevStep = r.tier ? a.steps[r.tier - 1] : 0;
      grid.append(h('div', { class: 'acard' + (r.tier ? ' on' : '') }, achVisual(r, 72),
        h('div', { class: 'abody' },
          h('b', null, a.name, h('span', { class: 'st' }, achStars(r))),
          h('small', null, `${a.what}: ${a.fmt(r.v)}`),
          r.tier < r.max ? bar((r.v - prevStep) / (r.next - prevStep)) : null,
          h('small', { class: 'anext' }, lvlTxt),
          h('small', { class: 'asteps' }, r.max === 1 ? `★ ${a.fmt(a.steps[0])}` : a.steps.map((x, i) => `${'★'.repeat(i + 1)} ${a.fmt(x)}`).join(' · ')))));
    }
    md.append(sec('Odznaki osiągnięć', grid));
  }, 'passport statsm');
}
const tripsAll = () => Object.values(S.trips).sort((a, b) => String(tripRange(b).start || '9').localeCompare(String(tripRange(a).start || '9')));
function openPassport() {
  openModal((md, close) => {
    const places = vplaces().sort((a, b) => String(a.startDate || a.endDate || '9').localeCompare(String(b.startDate || b.endDate || '9')));
    const photos = places.reduce((n, p) => n + photosOf(p).length, 0);
    const memos = places.reduce((n, p) => n + (p.memories || []).length, 0);
    md.append(
      h('div', { style: 'display:flex;align-items:center;justify-content:space-between;gap:10px' }, h('h3', { style: 'margin:0' }, perspName() ? `${isGroupKey(S.persp) ? 'Wspólny paszport' : 'Paszport'} · ${perspName()}` : 'Paszport podróży'),
        h('button', { class: 'btn icon ghost', 'aria-label': 'Zamknij', onclick: close }, ic('x'))),
      h('div', { class: 'pstats' },
        ...[[places.filter(isStamped).length, 'pieczątki', 'pieczątka', 'pieczątek'], [GROUPS.length, 'kraje', 'kraj', 'krajów'], [photos, 'zdjęcia', 'zdjęcie', 'zdjęć'], [memos, 'wspomnienia', 'wspomnienie', 'wspomnień']]
          .map(([n, few, one, many]) => h('div', { class: 'pstat' }, h('b', null, String(n)), h('span', null, plural(n, one, few, many))))),
      GROUPS.length ? h('div', { class: 'countries' }, GROUPS.map(g => h('button', { style: `background:${g.c.base}`, onclick: () => { close(); selectCountry(g.key); } }, g.name))) : null);
    const earned = GROUPS.map(g => ({ g, b: badgeOf(g) })).filter(x => x.b.ok && x.b.tier).sort((a, c) => c.b.tier - a.b.tier || c.b.stamps - a.b.stamps);
    if (earned.length) {
      md.append(h('h4', null, `Odznaki · ${earned.length}`));
      const bg = h('div', { class: 'pbadges' });
      for (const { g, b } of earned) bg.append(h('button', { class: 'pbadge', onclick: () => { close(); selectCountry(g.key); } }, badgeImg(b.iso, b.tier, `${g.name}: ${starStr(b.tier)}`), h('small', null, g.name)));
      md.append(bg);
    }
    const tst = travelStats(S.persp), ach = ACHIEVEMENTS.map(a => achOf(a, tst)).filter(r => r.tier);
    if (ach.length) {
      md.append(h('h4', null, `Osiągnięcia · ${ach.length}`));
      const ag = h('div', { class: 'pbadges' });
      for (const r of ach) ag.append(h('button', { class: 'pbadge', onclick: () => { close(); openStats(); } }, achVisual(r, 96), h('small', null, `${r.a.name} ${achStars(r)}`)));
      md.append(ag);
    }
    if (earned.length || ach.length) md.append(h('h4', null, 'Pieczątki'));
    const grid = h('div', { class: 'stamps' });
    for (const p of [...places.filter(isStamped), ...places.filter(x => !isStamped(x) && hasXY(x))]) {
      const b = h('button', { class: 'stampbtn', style: `--r:${(hash(p.id) % 25) - 12}deg`, onclick: () => { close(); travelTo(p.id); } });
      if (isStamped(p)) { const st = h('div', { class: 'stamp' }); st.append(stampSvg(p, 104)); b.append(st, h('small', null, p.name)); }
      else b.append(h('div', { class: 'stampph', style: 'width:104px;height:104px;transform:none' }, '+1 do odebrania'), h('small', null, p.name));
      grid.append(b);
    }
    if (!places.length) grid.append(h('p', null, 'Pieczątki pojawią się, gdy dodasz pierwsze miejsca.'));
    md.append(grid);
  }, 'passport');
}
function dice() {
  const pool = [];
  for (const p of vplaces()) {
    photosOf(p).forEach((x, i) => pool.push({ p, type: 'photo', i }));
    (p.memories || []).forEach(m => pool.push({ p, type: 'memo', id: m.id }));
  }
  if (!pool.length) return toast('Dodaj zdjęcia albo wspomnienia, a wylosuję jedno z nich.');
  const pick = pool[Math.floor(Math.random() * pool.length)];
  S.playing = false;
  travelTo(pick.p.id, { tab: pick.type === 'photo' ? 'photos' : 'memories' }).then(() => {
    if (pick.type === 'photo') openLightbox(pick.p.id, pick.i);
    else { S.flashMemo = pick.id; S.tab = 'memories'; S.sheetOpen = true; render(); }
  });
}

/* ================= misc ui ================= */
let toastT = 0;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 3600);
}
$('#zin').addEventListener('click', () => zoomBtn(1 / 1.8));
$('#zout').addEventListener('click', () => zoomBtn(1.8));
$('#zfit').addEventListener('click', () => {
  if (S.view === 'countries') { const g = groupByKey(S.countryKey); flyTo(targetForBounds(g ? countryBounds(g) : countriesBounds(), g ? 90 : overviewW()), 800); }
  else flyTo(targetForBounds(S.tripId ? tripBounds(S.tripId) : allBounds()), 800);
});
$('#playBtn').addEventListener('click', play);
$('#diceBtn').addEventListener('click', dice);
$('#passBtn').addEventListener('click', openPassport);
$('#travBtn').addEventListener('click', openTravelers);
$('#statBtn').addEventListener('click', openStats);
$('#panelToggle').addEventListener('click', () => { const f = focusOf(); S.panelOpen = !S.panelOpen; render(); setTimeout(() => flyTo({ fx: f.fx, fy: f.fy, w: f.w }, 380), 30); });
(function sheet() {
  const hd = $('#sheetHandle');
  let y0 = null;
  const toggle = v => { S.sheetOpen = v === undefined ? !S.sheetOpen : v; S.panelOpen = true; render(); };
  hd.addEventListener('pointerdown', e => { y0 = e.clientY; hd.setPointerCapture(e.pointerId); });
  hd.addEventListener('pointerup', e => { if (y0 == null) return; const dy = e.clientY - y0; y0 = null; if (dy < -30) toggle(true); else if (dy > 30) toggle(false); else toggle(); });
  hd.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } });
  // tapping the peeking header opens the sheet
  $('#panelBody').addEventListener('click', e => { if (isPhone() && !S.sheetOpen && !e.target.closest('button,a,input,label')) toggle(true); });
})();
document.addEventListener('keydown', e => {
  if (LB || $('#overlays').children.length || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  if (e.key === 'ArrowRight') stepStop(1);
  if (e.key === 'ArrowLeft') stepStop(-1);
});
window.addEventListener('resize', () => {
  const f = focusOf();
  vw = innerWidth; vh = innerHeight;
  setCam(viewFrom(f.fx, f.fy, f.w));
});

/* ================= boot ================= */
function start(data) {
  hot = data || {};
  vw = innerWidth; vh = innerHeight;
  setCam(viewFrom((WORLD[0] + WORLD[2]) / 2, (WORLD[1] + WORLD[3]) / 2 + 40, WORLD[2] - WORLD[0] + 40));
  if (isPhone()) S.sheetOpen = false;
  render();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => scheduleRender());
  connect();
}
try { window.claude?.hot?.snapshot?.(() => ({ view: S.view, countryKey: S.countryKey, tripId: S.tripId, placeId: S.placeId, tab: S.tab, persp: S.persp })); } catch (e) { /* no hot reload */ }
if (window.claude?.hot?.ready) window.claude.hot.ready(start); else start(window.claude?.hot?.data ?? {});
})();
</script>
